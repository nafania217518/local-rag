<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LocalRAG</title>
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
  :root { --desk: #ECEAE4; --paper: #F8F7F3; --ink: #26241F; --pencil: #6F6B62; --rule: #D6D3CB;
          --inkblue: #2B4C7E; --marker: #F2E7A1; --red: #9B3B2E; --ok: #3E6B48; --amber: #B8860B;
          --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
          --sans: -apple-system, "Segoe UI", system-ui, sans-serif; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --desk: #1A1917; --paper: #242320; --ink: #E8E4DA; --pencil: #9A958A; --rule: #3A3832;
    --inkblue: #8FB0E0; --marker: #5A4F1E; --red: #E08B7C; --ok: #8DBF97; --amber: #E0B04A; } }
  :root[data-theme="dark"] {
    --desk: #1A1917; --paper: #242320; --ink: #E8E4DA; --pencil: #9A958A; --rule: #3A3832;
    --inkblue: #8FB0E0; --marker: #5A4F1E; --red: #E08B7C; --ok: #8DBF97; --amber: #E0B04A; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 240px 1fr 320px;
         font: 13px/1.4 var(--sans); color: var(--ink); background: var(--desk); }
  .col { overflow: auto; padding: 16px; min-height: 0; }
  #left { display: flex; flex-direction: column; border-right: 1px solid var(--rule); }
  #sources-col { border-left: 1px solid var(--rule); }
  #footer { margin-top: auto; padding-top: 16px; display: flex; justify-content: space-between; align-items: center; }
  h2 { font: 600 12px/1.4 var(--sans); color: var(--pencil); margin: 20px 0 8px; }
  .col > h2:first-child { margin-top: 0; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 6px 8px; cursor: pointer; display: flex; gap: 8px; align-items: center; border-left: 2px solid transparent; }
  li.selected { background: var(--paper); border-left-color: var(--inkblue); }
  .name, .source-head { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* dot only: the status word stays in the DOM for assistive tech; the 7px dot overflows the 0-width box */
  .status { flex: none; position: relative; width: 0; height: 7px; margin: 0 7px 0 auto; font-size: 0; white-space: nowrap; }
  .status::before { content: ""; position: absolute; left: 0; top: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--pencil); }
  li[data-status="indexed"] .status::before { background: var(--ok); }
  li[data-status="pending"] .status::before { background: var(--amber); }
  li[data-status="failed"] .status::before { background: var(--red); }
  .doc-delete { border: 0; background: none; padding: 0 4px; color: var(--pencil); visibility: hidden; }
  li:hover .doc-delete, li:focus-within .doc-delete { visibility: visible; }
  .empty { font: 14px/1.5 var(--serif); color: var(--pencil); margin: 12px 0 0; }
  #messages .empty { margin: 0; }
  .icon { border: 0; background: none; padding: 4px; color: var(--pencil); display: inline-flex; align-items: center; }
  .icon:hover { color: var(--ink); }
  .icon svg { width: 16px; height: 16px; }
  .head-row { display: flex; justify-content: space-between; align-items: center; }
  .head-row h2 { margin: 0; }
  #left > .head-row:first-child { margin-bottom: 8px; }
  .ws-menu { opacity: 0; }
  li:hover .ws-menu, li:focus-within .ws-menu { opacity: 1; }
  #ws-popover { position: fixed; z-index: 10; display: flex; flex-direction: column; background: var(--paper);
                border: 1px solid var(--rule); border-radius: 3px; padding: 4px; }
  #ws-popover[hidden] { display: none; }
  #ws-popover button { border: 0; text-align: left; display: flex; gap: 6px; align-items: center; }
  #ws-popover svg { width: 14px; height: 14px; }
  #workspaces { flex: none; max-height: 40vh; overflow: auto; }
  #documents { flex: 1 1 auto; min-height: 0; overflow: auto; }
  #left { overflow: hidden; }
  #left > * { flex: none; }
  #left > #documents { flex: 1 1 auto; }
  .docs-head { margin: 20px 0 8px; }
  #doc-count { font-weight: 400; margin-left: 4px; }
  #doc-filter { width: 100%; margin-bottom: 8px; }
  #doc-filter[hidden], li.hidden { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    li[data-status="pending"] .status::before { animation: pulse 1.6s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: 1; } to { opacity: 0.35; } } }
  #ws-popover button:hover { background: var(--desk); }
  button, input, select, textarea { font: 13px/1.4 var(--sans); color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 3px; padding: 6px 10px; }
  button, .file-btn { cursor: pointer; }
  .primary { border-color: var(--ink); }
  :focus-visible { outline: 2px solid var(--inkblue); outline-offset: 2px; }
  .files { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
                     clip-path: inset(50%); white-space: nowrap; }
  .file-btn { border: 1px solid var(--rule); border-radius: 3px; padding: 6px 10px; background: var(--paper); }
  #upload:focus-visible + .file-btn { outline: 2px solid var(--inkblue); outline-offset: 2px; }
  #file-count { color: var(--pencil); }
  #theme { display: flex; }
  #theme button { border-radius: 0; margin-left: -1px; padding: 4px 8px; display: inline-flex; }
  #theme svg { width: 16px; height: 16px; }
  #theme button:first-child { border-radius: 3px 0 0 3px; }
  #theme button:last-child { border-radius: 0 3px 3px 0; }
  #theme button[aria-pressed="true"] { background: var(--desk); border-color: var(--inkblue); color: var(--inkblue); position: relative; }
  #centre { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
  #topbar { flex: none; display: flex; align-items: flex-end; gap: 4px; padding: 12px 16px 0; }
  #sessions { display: flex; gap: 2px; min-width: 0; overflow: hidden; }
  .tab { display: flex; align-items: center; gap: 4px; max-width: 200px; padding: 6px 6px 6px 12px; cursor: pointer;
         background: var(--desk); border: 1px solid var(--rule); border-bottom: 0; border-radius: 6px 6px 0 0; color: var(--pencil); }
  .tab.active { background: var(--paper); color: var(--ink); position: relative; top: 1px; padding-bottom: 7px; }
  .tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-close { border: 0; background: none; padding: 0 4px; color: var(--pencil); opacity: 0; }
  .tab:hover .tab-close, .tab:focus-within .tab-close { opacity: 1; }
  #session-new { margin-bottom: 4px; }
  #messages { flex: 1; overflow: auto; margin: 0 16px 16px; padding: 20px 24px; background: var(--paper);
              border: 1px solid var(--rule); border-radius: 2px; }
  .msg { white-space: pre-wrap; }
  .msg.user { font-weight: 600; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--rule); }
  .msg.user:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .msg.assistant { font: 15px/1.55 var(--serif); max-width: 68ch; margin-top: 8px; }
  .error { color: var(--red); }
  .cite { color: var(--inkblue); text-decoration: none; cursor: pointer; vertical-align: 0.15em; font-size: 0.85em; }
  details.thinking summary { font: 12px/1.4 var(--sans); color: var(--pencil); cursor: pointer; }
  details.thinking pre { white-space: pre-wrap; font: 12px/1.4 var(--sans); color: var(--pencil); }
  #ask-form { flex: none; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: stretch; margin: 0 16px 16px; }
  #question { resize: none; min-height: 44px; max-height: 160px; padding: 10px 12px; }
  .source { margin-bottom: 16px; }
  .source pre { white-space: pre-wrap; margin: 4px 0 0; padding: 2px 4px; font: 15px/1.55 var(--serif); }
  .source.highlight pre { background: var(--marker); }
  @media (prefers-reduced-motion: no-preference) { li, .source pre { transition: background-color .15s; } }
  dialog { background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px; padding: 20px; width: 360px; }
  dialog form { display: flex; flex-direction: column; gap: 10px; }
  dialog label { display: flex; flex-direction: column; gap: 4px; }
  dialog label.check { flex-direction: row; align-items: center; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div class="col" id="left">
  <div class="head-row"><h2>Workspaces</h2><button id="ws-add" class="icon" aria-label="New workspace" title="New workspace"><svg data-icon="plus" viewBox="0 0 16 16" stroke="currentColor" fill="none" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg></button></div>
  <ul id="workspaces"></ul>
  <p class="empty" id="ws-empty" hidden>Create a workspace to start.</p>
  <div class="head-row docs-head"><h2>Documents <span id="doc-count"></span></h2><button id="doc-filter-btn" class="icon" aria-label="Filter documents" title="Filter documents"><svg viewBox="0 0 16 16" stroke="currentColor" fill="none" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.3 10.3L14 14"/></svg></button></div>
  <input id="doc-filter" placeholder="Filter documents" aria-label="Filter documents" hidden>
  <ul id="documents"></ul>
  <p class="empty" id="docs-empty" hidden>Add documents to this workspace.</p>
  <div class="files">
    <input type="file" id="upload" multiple class="visually-hidden"><label for="upload" class="file-btn">Choose files</label>
    <span id="file-count"></span>
    <button id="upload-btn" class="primary">Upload</button>
  </div>
  <div id="footer">
    <button id="settings-btn" class="icon" aria-label="Settings" title="Settings"><svg data-icon="gear" viewBox="0 0 16 16" stroke="currentColor" fill="none" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r="6"/><path d="M8 2V0M8 14v2M2 8H0M14 8h2M3.76 3.76L2.34 2.34M12.24 12.24l1.42 1.42M3.76 12.24l-1.42 1.42M12.24 3.76l1.42-1.42"/></svg></button>
    <div id="theme" role="group" aria-label="Theme">
      <button type="button" value="system" aria-label="System theme" title="System theme"><svg viewBox="0 0 16 16" stroke="currentColor" fill="none" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor"/></svg></button><button type="button" value="light" aria-label="Light theme" title="Light theme"><svg viewBox="0 0 16 16" stroke="currentColor" fill="none" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/></svg></button><button type="button" value="dark" aria-label="Dark theme" title="Dark theme"><svg viewBox="0 0 16 16" stroke="currentColor" fill="none" stroke-width="1.5"><path d="M13 9.5A5.5 5.5 0 1 1 6.5 3a4.5 4.5 0 0 0 6.5 6.5z"/></svg></button>
    </div>
  </div>
</div>
<div class="col" id="centre">
  <div id="topbar"><div id="sessions"></div><button id="session-new" class="icon" aria-label="New chat" title="New chat"><svg data-icon="plus" viewBox="0 0 16 16" stroke="currentColor" fill="none" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg></button></div>
  <div id="messages"></div>
  <form id="ask-form"><textarea id="question" placeholder="Ask about the documents…"></textarea><button id="ask" class="primary">Ask</button></form>
</div>
<div class="col" id="sources-col"><h2>Sources</h2><div id="sources"></div></div>

<div id="ws-popover" hidden><button data-action="rename"><svg viewBox="0 0 16 16" stroke="currentColor" fill="none" stroke-width="1.5"><path d="M11 2.5l2.5 2.5L6 12.5 2.5 13.5 3.5 10z"/></svg>Rename</button><button data-action="delete"><svg viewBox="0 0 16 16" stroke="currentColor" fill="none" stroke-width="1.5"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.5 6.5v4.5M9.5 6.5v4.5"/></svg>Delete</button></div>
<dialog id="ws-dialog">
  <form method="dialog">
    <h2 id="ws-dialog-title">New workspace</h2>
    <input id="ws-name" aria-labelledby="ws-dialog-title">
    <div class="actions"><button id="ws-cancel" type="button">Cancel</button><button id="ws-create" type="submit" class="primary">OK</button></div>
  </form>
</dialog>
<dialog id="ws-delete-dialog">
  <form method="dialog">
    <p id="ws-delete-text"></p>
    <div class="actions"><button id="ws-delete-cancel" value="cancel">Cancel</button><button id="ws-delete-ok" value="ok" class="primary">Delete</button></div>
  </form>
</dialog>
<dialog id="settings">
  <form method="dialog">
    <label>API key <input type="password" name="api_key"></label>
    <label>Chat model <input name="chat_model"></label>
    <label>Embed model <input name="embed_model"></label>
    <label>Rerank model <input name="rerank_model"></label>
    <label>Parse model <input name="parse_model"></label>
    <label class="check"><input type="checkbox" name="rerank"> Rerank</label>
    <label>Reasoning effort
      <select name="reasoning_effort"><option>none</option><option>high</option><option>max</option></select></label>
    <div class="actions">
      <button value="cancel" formmethod="dialog">Cancel</button>
      <button id="settings-save" value="save" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
const state = { ws: null, session: null, messages: [] };
let pollTimer = null;

function remember(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

async function api(method, path, body) {
  const opts = { method };
  if (body instanceof FormData) opts.body = body;
  else if (body !== undefined) { opts.body = JSON.stringify(body); opts.headers = { "Content-Type": "application/json" }; }
  const r = await fetch(path, opts);
  return r.status === 204 ? null : r.json();
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Workspaces
async function loadWorkspaces() {
  const list = await api("GET", "/workspaces");
  const ul = $("#workspaces");
  ul.replaceChildren();
  for (const w of list) {
    const li = el("li", w.id === state.ws ? "selected" : "");
    li.dataset.id = w.id;
    li.onclick = () => selectWorkspace(w.id);
    const menu = el("button", "icon ws-menu");
    menu.setAttribute("aria-label", "Workspace menu");
    menu.title = "Workspace menu";
    menu.innerHTML = DOTS;
    menu.onclick = (e) => { e.stopPropagation(); openPopover(menu, w); };
    li.append(el("span", "name", w.name), menu);
    ul.append(li);
  }
  $("#ws-empty").hidden = list.length > 0;
}

async function selectWorkspace(id, sessionId = null) {
  state.ws = id;
  remember("ws", id);
  await loadWorkspaces();
  await loadDocuments();
  await loadSessions(sessionId);
}

const DOTS = '<svg viewBox="0 0 16 16" stroke="currentColor" fill="none" stroke-width="1.5"><circle cx="3.5" cy="8" r="0.8"/><circle cx="8" cy="8" r="0.8"/><circle cx="12.5" cy="8" r="0.8"/></svg>';
let editing = null;  // workspace being renamed; null = create

function openWsDialog(w = null) {
  editing = w;
  $("#ws-dialog-title").textContent = w ? "Rename workspace" : "New workspace";
  $("#ws-name").value = w ? w.name : "";
  $("#ws-dialog").showModal();
}
$("#ws-add").onclick = () => openWsDialog();
$("#ws-cancel").onclick = () => $("#ws-dialog").close();
$("#ws-dialog form").onsubmit = async (e) => {
  e.preventDefault();
  const name = $("#ws-name").value.trim();
  if (!name) return;
  $("#ws-dialog").close();
  if (editing) { await api("PUT", `/workspaces/${editing.id}`, { name }); await loadWorkspaces(); }
  else await selectWorkspace((await api("POST", "/workspaces", { name })).id);
};

let menuWs = null;
function openPopover(btn, w) {
  menuWs = w;
  const r = btn.getBoundingClientRect(), pop = $("#ws-popover");
  pop.style.left = `${r.left}px`;
  pop.style.top = `${r.bottom + 2}px`;
  pop.hidden = false;
}
const closePopover = () => { $("#ws-popover").hidden = true; };
document.addEventListener("click", (e) => { if (!$("#ws-popover").contains(e.target)) closePopover(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePopover(); });
$("#ws-popover [data-action=rename]").onclick = () => { closePopover(); openWsDialog(menuWs); };
$("#ws-popover [data-action=delete]").onclick = () => {
  closePopover();
  $("#ws-delete-text").textContent = `Delete workspace ${menuWs.name}? Its documents and chats are deleted.`;
  $("#ws-delete-dialog").showModal();
};
$("#ws-delete-ok").onclick = async () => {
  await api("DELETE", `/workspaces/${menuWs.id}`);
  if (menuWs.id === state.ws) {
    state.ws = state.session = null; state.messages = [];
    $("#documents").replaceChildren(); $("#sessions").replaceChildren(); renderMessages();
  }
  await loadWorkspaces();
};

// Documents
async function loadDocuments() {
  if (!state.ws) return;
  const docs = await api("GET", `/workspaces/${state.ws}/documents`);
  const ul = $("#documents");
  ul.replaceChildren();
  for (const d of docs) {
    const li = el("li");
    const nm = el("span", "name", d.name);
    nm.title = d.name;
    li.append(nm);
    li.dataset.id = d.id;
    li.dataset.status = d.status;
    li.title = d.status === "failed" ? d.error || "failed" : d.status === "pending" ? "Indexing" : "Indexed";
    const del = el("button", "doc-delete", "×");
    del.onclick = async () => { await api("DELETE", `/workspaces/${state.ws}/documents/${d.id}`); loadDocuments(); };
    li.append(el("span", "status", d.status), del);
    ul.append(li);
  }
  $("#docs-empty").hidden = docs.length > 0;
  $("#doc-count").textContent = docs.length || "";
  filterDocuments();
  clearTimeout(pollTimer);
  if (docs.some((d) => d.status === "pending")) pollTimer = setTimeout(loadDocuments, 1500);
}

function filterDocuments() {
  const q = $("#doc-filter").value.toLowerCase();
  for (const li of $("#documents").children) li.classList.toggle("hidden", !li.querySelector(".name").textContent.toLowerCase().includes(q));
}
$("#doc-filter").oninput = filterDocuments;
$("#doc-filter-btn").onclick = () => { $("#doc-filter").hidden = false; $("#doc-filter").focus(); };

$("#upload-btn").onclick = async () => {
  const files = $("#upload").files;
  if (!state.ws || !files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append("files", f);
  await api("POST", `/workspaces/${state.ws}/documents`, fd);
  $("#upload").value = "";
  $("#file-count").textContent = "";
  loadDocuments();
};

$("#upload").onchange = () => {
  const n = $("#upload").files.length;
  $("#file-count").textContent = n ? `${n} file${n > 1 ? "s" : ""} chosen` : "";
};

// Sessions
async function loadSessions(selectId = null) {
  let list = await api("GET", `/workspaces/${state.ws}/sessions`);
  if (!list.length) list = [await api("POST", `/workspaces/${state.ws}/sessions`, { title: "New chat" })];
  const keep = list.find((s) => s.id === Number(selectId)) || list[list.length - 1];
  renderTabs(list, keep.id);
  await selectSession(keep.id);
}

function renderTabs(list, activeId) {
  $("#sessions").replaceChildren(...list.map((s, i) => {
    const tab = el("div", s.id === activeId ? "tab active" : "tab");
    tab.dataset.id = s.id;
    const t = el("span", "tab-title", s.title);
    t.title = s.title;
    const x = el("button", "tab-close", "×");
    x.setAttribute("aria-label", "Close chat");
    x.title = "Close chat";
    x.onclick = async (e) => {
      e.stopPropagation();
      await api("DELETE", `/sessions/${s.id}`);
      const next = list[i + 1] || list[i - 1];
      await loadSessions(s.id === state.session ? next && next.id : state.session);
    };
    tab.onclick = () => { renderTabs(list, s.id); selectSession(s.id); };
    tab.append(t, x);
    return tab;
  }));
}

async function selectSession(id) {
  state.session = id;
  state.messages = id ? await api("GET", `/sessions/${id}/messages`) : [];
  if (id) remember("session", id);
  renderMessages();
}

$("#session-new").onclick = async () => {
  if (!state.ws) return;
  const s = await api("POST", `/workspaces/${state.ws}/sessions`, { title: "New chat" });
  await loadSessions(s.id);
};

// Messages
function renderContent(div, text) {
  div.replaceChildren();
  for (const part of text.split(/(\[\d+\])/)) {
    const m = part.match(/^\[(\d+)\]$/);
    if (!m) { div.append(part); continue; }
    const span = el("span", "cite", part);
    span.dataset.n = m[1];
    span.onclick = () => highlight(m[1]);
    div.append(span);
  }
}

function messageEl(msg) {
  const div = el("div", `msg ${msg.role}`);
  if (msg.role === "user") { div.textContent = msg.content; return div; }
  if (msg.thinking) {
    const d = el("details", "thinking");
    d.append(el("summary", "", "Thinking"), el("pre", "", msg.thinking));
    div.append(d);
  }
  const c = el("div", "content");
  renderContent(c, msg.content);
  if (msg.error) c.append(el("div", "error", msg.error));
  div.append(c);
  return div;
}

function renderMessages() {
  const box = $("#messages");
  box.replaceChildren(...state.messages.map(messageEl));
  if (!state.messages.length) box.append(el("p", "empty", state.session ? "Ask a question about the documents in this workspace." : "Start a new chat."));
  $("#messages").scrollTop = $("#messages").scrollHeight;
  const last = [...state.messages].reverse().find((m) => m.role === "assistant");
  renderSources(last && last.citations);
}

function renderSources(citations) {
  const box = $("#sources");
  box.replaceChildren();
  for (const c of citations || []) {
    const d = el("div", "source");
    d.dataset.n = c.n;
    const head = el("div", "source-head");
    head.title = c.document_name;
    head.append(el("strong", "", `[${c.n}] ${c.document_name}, p.${c.page}`));
    d.append(head, el("pre", "", c.text.replace(/([^\n])\n(?!\n)/g, "$1 ")));
    box.append(d);
  }
}

function highlight(n) {
  for (const s of document.querySelectorAll("#sources .source")) s.classList.toggle("highlight", s.dataset.n === n);
}

// Chat
async function ask() {
  const question = $("#question").value.trim();
  if (!question || !state.session || $("#ask").disabled) return;
  $("#question").value = "";
  $("#ask").disabled = true;
  const msg = { role: "assistant", content: "", thinking: "" };
  state.messages.push({ role: "user", content: question }, msg);
  renderMessages();
  const handle = (event, data) => {
    if (event === "token") msg.content += data;
    else if (event === "thinking") msg.thinking += data;
    else if (event === "citations") msg.citations = data;
    else if (event === "error") msg.error = data.message;
  };
  try {
    const r = await fetch(`/sessions/${state.session}/chat`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }),
    });
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, i);
        buf = buf.slice(i + 2);
        let event = "message", data = "";
        for (const line of frame.split("\n")) {
          if (line.startsWith("event: ")) event = line.slice(7);
          else if (line.startsWith("data: ")) data += line.slice(6);
        }
        handle(event, JSON.parse(data));
        renderMessages();
      }
    }
  } catch (e) {
    msg.error = String(e);
    renderMessages();
  } finally {
    $("#ask").disabled = false;
  }
  const sid = state.session;
  const list = await api("GET", `/workspaces/${state.ws}/sessions`);
  if (sid === state.session) renderTabs(list, sid);
}

$("#ask-form").onsubmit = (e) => { e.preventDefault(); ask(); };
$("#question").onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
};

// Settings
const settingsForm = $("#settings form");
$("#settings-btn").onclick = async () => {
  const cfg = await api("GET", "/settings");
  for (const input of settingsForm.elements) {
    if (!input.name) continue;
    if (input.type === "checkbox") input.checked = !!cfg[input.name];
    else input.value = cfg[input.name] ?? "";
  }
  $("#settings").showModal();
};
$("#settings-save").onclick = async (e) => {
  e.preventDefault();
  const body = {};
  for (const input of settingsForm.elements) {
    if (!input.name) continue;
    body[input.name] = input.type === "checkbox" ? input.checked : input.value;
  }
  await api("PUT", "/settings", body);
  $("#settings").close();
};

// Theme
function applyTheme(t) {
  if (t === "system") { document.documentElement.removeAttribute("data-theme"); try { localStorage.removeItem("theme"); } catch (e) {} }
  else { document.documentElement.dataset.theme = t; remember("theme", t); }
  for (const b of document.querySelectorAll("#theme button")) b.setAttribute("aria-pressed", String(b.value === t));
}
for (const b of document.querySelectorAll("#theme button")) b.onclick = () => applyTheme(b.value);
applyTheme(recall("theme") || "system");

// Start
renderMessages();
(async () => {
  await loadWorkspaces();
  const ws = Number(recall("ws"));
  if (ws && document.querySelector(`#workspaces li[data-id="${ws}"]`)) await selectWorkspace(ws, recall("session"));
})();
</script>
