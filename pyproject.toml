[project]
name = "localrag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sqlite-vec>=0.1.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=localrag --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["localrag"]
