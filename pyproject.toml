[project]
name = "localrag"
version = "0.1.4"
requires-python = ">=3.12"
dependencies = [
    "sqlite-vec>=0.1.9",
    "openai>=1.50",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "pywebview>=5",
    "uvicorn>=0.30",
]

[project.scripts]
localrag = "localrag.app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-playwright>=0.5",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=localrag --cov-report=term-missing --cov-fail-under=90"
markers = [
    "live: calls build.nvidia.com, needs NVIDIA_API_KEY",
    "ui: browser tests with headless Chromium",
]

[tool.coverage.run]
source = ["localrag"]
